name: build

# Собирает: APK (Android-телефоны и Android TV), EXE-установщик (Windows 7–11), DEB и RPM (Linux).
# При пуше тега вида v1.2.3 — публикует релиз со всеми файлами.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Go 1.20 — последняя версия Go, чьи программы запускаются на Windows 7/8.
  GO_WIN7: "1.20.14"
  # Tor 13.5.x — последняя ветка с транспортами, работающими на Windows 7/8.
  TOR_LEGACY: "13.5.29"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
      winver: ${{ steps.v.outputs.winver }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V="$(cat VERSION).${GITHUB_RUN_NUMBER}"
          fi
          # Для Windows нужна версия ровно из 4 чисел.
          W=$(echo "$V" | grep -oE '^[0-9]+(\.[0-9]+){0,3}')
          while [ "$(echo "$W" | tr -cd . | wc -c)" -lt 3 ]; do W="$W.0"; done
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "winver=$W" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Версия: $V (Windows: $W, versionCode: $GITHUB_RUN_NUMBER)"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_WIN7 }}
          cache: false
      - name: Тесты ядра (Go 1.20)
        working-directory: core
        run: |
          go vet ./...
          go test -count=1 ./...
          for t in windows/386 windows/amd64 linux/amd64 linux/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} go vet ./...
          done

  windows:
    needs: [version, test]
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.version.outputs.version }}
      WV: ${{ needs.version.outputs.winver }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_WIN7 }}
          cache: false
      - name: Инструменты (NSIS, windres)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis binutils-mingw-w64-i686 zip
      - name: Иконка программы
        working-directory: core
        run: |
          printf '1 ICON "../assets/obhod.ico"\n' > obhod.rc
          i686-w64-mingw32-windres -O coff -i obhod.rc -o rsrc_windows_386.syso || echo "иконка не встроена"
      - name: Сборка Obhod.exe (x86, работает на Windows 7–11 x86/x64)
        working-directory: core
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=386 go build -trimpath \
            -ldflags "-s -w -H=windowsgui -X main.appVersion=$V" -o ../build/win/Obhod.exe .
      - name: Tor для Windows 7/8 (ветка 13.5)
        run: bash scripts/fetch-tor.sh windows-i686 build/win/tor-legacy "$TOR_LEGACY"
      - name: Tor для Windows 10/11 (актуальный)
        run: |
          if ! bash scripts/fetch-tor.sh windows-i686 build/win/tor-modern; then
            bash scripts/fetch-tor.sh windows-x86_64 build/win/tor-modern
            touch build/win/tor-modern/ARCH_x64
          fi
      - name: Установщик (NSIS)
        run: |
          cp assets/obhod.ico build/win/
          sed 's/$/\r/' README.md > build/win/README.txt
          makensis -V3 -DVERSION="$V" -DVIVERSION="$WV" -DSRC=../../build/win packaging/windows/obhod.nsi
          mkdir -p dist && mv packaging/windows/Obhod-Setup-*.exe dist/
      - name: Портативная версия (zip, Windows 7–11)
        run: |
          mkdir -p build/portable/Obhod
          cp build/win/Obhod.exe build/win/README.txt build/portable/Obhod/
          cp -r build/win/tor-legacy build/portable/Obhod/tor
          (cd build/portable && zip -qr "../../dist/Obhod-Portable-$V-windows.zip" Obhod)
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    needs: [version, test]
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_WIN7 }}
          cache: false
      - name: Сборка obhod (linux/amd64)
        working-directory: core
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.appVersion=$V" -o ../build/linux/obhod .
      - name: Tor для Linux
        run: bash scripts/fetch-tor.sh linux-x86_64 build/linux/tor
      - name: nfpm
        run: |
          NV=$(curl -fsSL -o /dev/null -w '%{url_effective}' https://github.com/goreleaser/nfpm/releases/latest | grep -oE '[0-9]+\.[0-9]+\.[0-9]+$')
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NV}/nfpm_${NV}_Linux_x86_64.tar.gz" | tar xz nfpm
          sudo mv nfpm /usr/local/bin/
      - name: DEB и RPM
        run: |
          mkdir -p dist
          VERSION="$V" nfpm package -f packaging/linux/nfpm.yaml -p deb -t dist/
          VERSION="$V" nfpm package -f packaging/linux/nfpm.yaml -p rpm -t dist/
          tar czf "dist/obhod-$V-linux-amd64.tar.gz" -C build/linux obhod tor
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  android:
    needs: [version, test]
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.version.outputs.version }}
      CODE: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Встроенные мосты Tor (pt_config.json)
        run: |
          bash scripts/fetch-tor.sh android-aarch64 build/tor-android || bash scripts/fetch-tor.sh linux-x86_64 build/tor-android
          mkdir -p android/app/src/main/assets
          cp build/tor-android/pt/pt_config.json android/app/src/main/assets/
      - name: Android NDK r27 (с ним проверен hev-socks5-tunnel)
        run: |
          NDKV=27.2.12479018
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -d "$ANDROID_HOME/ndk/$NDKV" ] || (yes | "$SDKM" --install "ndk;$NDKV" > /dev/null)
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDKV" >> "$GITHUB_ENV"
      - name: Нативные части (ядро, lyrebird, hev-socks5-tunnel)
        run: bash scripts/build-android-natives.sh "$V"
      - name: Ключ подписи (если задан в секретах)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Подпись release-ключом"
          else
            echo "Секрет ANDROID_KEYSTORE_BASE64 не задан — APK будет подписан debug-ключом"
          fi
      - name: Сборка APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle -p android --no-daemon assembleRelease -PappVersion="$V" -PappVersionCode="$CODE"
          mkdir -p dist
          for f in android/app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" .apk | sed -E 's/^app-//; s/-release(-unsigned)?$//')
            cp "$f" "dist/Obhod-$V-android-$abi.apk"
          done
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: (cd dist && sha256sum * > SHA256SUMS.txt && ls -la)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
