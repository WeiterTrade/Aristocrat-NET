name: build

# Собирает: APK (Android-телефоны и Android TV), EXE-установщик (Windows 7–11), DEB и RPM (Linux).
# Готовые файлы — только в Actions (артефакты сборки), в «Релизы» ничего не публикуется.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # go.sum не хранится в репозитории: недостающие суммы Go дописывает сам во время сборки.
  # «go mod tidy» не подходит: он учитывает сразу все версии Go, а сетевой стек WARP
  # собирается из разных версий gVisor для Go 1.20 (Windows 7) и для новых Go.
  GOFLAGS: -mod=mod
  # Go 1.20 — последняя версия Go, чьи программы запускаются на Windows 7/8.
  GO_WIN7: "1.20.14"
  # Tor 13.5.x — последняя ветка с транспортами, работающими на Windows 7/8.
  TOR_LEGACY: "13.5.29"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
      winver: ${{ steps.v.outputs.winver }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V="$(cat VERSION).${GITHUB_RUN_NUMBER}"
          fi
          # Для Windows нужна версия ровно из 4 чисел.
          W=$(echo "$V" | grep -oE '^[0-9]+(\.[0-9]+){0,3}')
          while [ "$(echo "$W" | tr -cd . | wc -c)" -lt 3 ]; do W="$W.0"; done
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "winver=$W" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Версия: $V (Windows: $W, versionCode: $GITHUB_RUN_NUMBER)"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_WIN7 }}
          cache: false
      - name: Зависимости Go (go.sum)
        working-directory: core
        run: go mod download
      - name: Тесты ядра (Go 1.20)
        working-directory: core
        run: |
          go vet ./...
          go test -count=1 ./...
          go vet -tags dev .
          go test -count=1 -tags dev -run 'Dev' .
          for t in windows/386 windows/amd64 linux/amd64 linux/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} go vet ./...
            GOOS=${t%/*} GOARCH=${t#*/} go vet -tags dev .
          done

  windows:
    needs: [version, test]
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.version.outputs.version }}
      WV: ${{ needs.version.outputs.winver }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_WIN7 }}
          cache: false
      - name: Зависимости Go (go.sum)
        working-directory: core
        run: go mod download
      - name: Инструменты (windres + mingw-gcc для препроцессора ресурсов)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binutils-mingw-w64-i686 gcc-mingw-w64-i686 zip
      - name: Иконка и манифест программы
        working-directory: core
        run: |
          # Иконка (ресурс 1) и манифест (стили Windows и DPI — без него окна не создадутся).
          # Сведения о файле: в Диспетчере задач и свойствах файла — «Aristocrat NET».
          cat > obhod.rc <<'RC'
          1 ICON "../assets/obhod.ico"
          1 24 "../packaging/windows/obhod.manifest"
          1 VERSIONINFO
          FILEVERSION 1,0,0,0
          PRODUCTVERSION 1,0,0,0
          BEGIN
            BLOCK "StringFileInfo"
            BEGIN
              BLOCK "041904B0"
              BEGIN
                VALUE "CompanyName", "Aristocrat NET"
                VALUE "FileDescription", "Aristocrat NET"
                VALUE "ProductName", "Aristocrat NET"
                VALUE "OriginalFilename", "Obhod.exe"
                VALUE "LegalCopyright", "MIT"
              END
            END
            BLOCK "VarFileInfo"
            BEGIN
              VALUE "Translation", 0x419, 1200
            END
          END
          RC
          i686-w64-mingw32-windres -O coff -i obhod.rc -o rsrc_windows_386.syso
      - name: Код подключения и пароль разработчика (секреты DEV_DIRECT и DEV_PASSWORD)
        env:
          DEV_DIRECT: ${{ secrets.DEV_DIRECT }}
          DEV_PASSWORD: ${{ secrets.DEV_PASSWORD }}
        run: |
          echo "DEVDIRECT=$(bash scripts/dev-direct.sh)" >> "$GITHUB_ENV"
          echo "DEVHASH=$(cd core && go run ./tools/devhash)" >> "$GITHUB_ENV"
          [ -n "$DEV_PASSWORD" ] || echo "::warning::Секрет DEV_PASSWORD не задан — в сборке разработчика режим не откроется"
      - name: Сборка Obhod.exe (x86, работает на Windows 7–11 x86/x64)
        working-directory: core
        run: |
          # Для всех пользователей — без маршрута «Ебаная Чукотка».
          CGO_ENABLED=0 GOOS=windows GOARCH=386 go build -trimpath \
            -ldflags "-s -w -H=windowsgui -X main.appVersion=$V" -o ../build/win/Obhod.exe .
          # Edward Version — с маршрутом «Ебаная Чукотка» (код из секрета DEV_DIRECT).
          CGO_ENABLED=0 GOOS=windows GOARCH=386 go build -trimpath \
            -ldflags "-s -w -H=windowsgui -X main.appVersion=$V -X main.edition=edward -X main.devDirectCode=$DEVDIRECT" -o ../build/win/ObhodEdward.exe .
          # Сборка разработчика: раздача интернета, пароль — только хэш из секрета DEV_PASSWORD.
          CGO_ENABLED=0 GOOS=windows GOARCH=386 go build -tags dev -trimpath \
            -ldflags "-s -w -H=windowsgui -X main.appVersion=$V -X main.devPassHash=$DEVHASH -X main.devDirectCode=$DEVDIRECT" -o ../build/win/ObhodDev.exe .
      - name: Tor для Windows 7/8 (ветка 13.5)
        run: bash scripts/fetch-tor.sh windows-i686 build/win/tor-legacy "$TOR_LEGACY"
      - name: Tor для Windows 10/11 (актуальный)
        run: |
          if ! bash scripts/fetch-tor.sh windows-i686 build/win/tor-modern; then
            bash scripts/fetch-tor.sh windows-x86_64 build/win/tor-modern
            touch build/win/tor-modern/ARCH_x64
          fi
      - name: Файлы для установщика
        run: |
          cp assets/obhod.ico build/win/
          sed 's/$/\r/' README.md > build/win/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: _win-build
          path: build/win
      - name: Портативная версия (zip, Windows 7–11)
        run: |
          mkdir -p dist build/portable/AristocratNET
          cp build/win/Obhod.exe build/win/README.txt build/portable/AristocratNET/
          cp -r build/win/tor-legacy build/portable/AristocratNET/tor
          (cd build/portable && zip -qr "../../dist/AristocratNET-Portable-$V-windows.zip" AristocratNET)
          mkdir -p dist-edward
          cp build/win/ObhodEdward.exe build/portable/AristocratNET/Obhod.exe
          (cd build/portable && zip -qr "../../dist-edward/AristocratNET-Edward-Portable-$V-windows.zip" AristocratNET)
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: edward-windows
          path: dist-edward/*

  # Установщик — Inno Setup (окно установки как у современных программ Windows), собирается на Windows.
  windows-setup:
    needs: [version, windows]
    runs-on: windows-latest
    env:
      V: ${{ needs.version.outputs.version }}
      WV: ${{ needs.version.outputs.winver }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: _win-build
          path: build/win
      - name: Inno Setup 6.2.2 (последняя версия, установщики которой работают на Windows 7)
        shell: pwsh
        run: |
          choco install innosetup --version=6.2.2 --allow-downgrade --force -y --no-progress
          if ($LASTEXITCODE -ne 0) { Write-Host "Не удалось поставить 6.2.2 — используется Inno Setup из образа" }
          exit 0
      - name: Установщики Inno Setup — для пользователей и для разработчика
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          New-Item -ItemType Directory -Force dist, dist-dev, dist-edward | Out-Null
          # Для разработчика и Edward Version — та же папка, но другой Obhod.exe.
          Copy-Item -Recurse build/win build/win-dev
          Move-Item -Force build/win-dev/ObhodDev.exe build/win-dev/Obhod.exe
          Remove-Item build/win-dev/ObhodEdward.exe
          Copy-Item -Recurse build/win build/win-edward
          Move-Item -Force build/win-edward/ObhodEdward.exe build/win-edward/Obhod.exe
          Remove-Item build/win-edward/ObhodDev.exe
          Remove-Item build/win/ObhodDev.exe, build/win/ObhodEdward.exe
          $src = (Resolve-Path build/win).Path
          & $iscc /Q "/DVERSION=$env:V" "/DVIVERSION=$env:WV" "/DSRC=$src" packaging/windows/obhod.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item packaging/windows/AristocratNET-Setup-*.exe dist/
          $src = (Resolve-Path build/win-edward).Path
          & $iscc /Q "/DVERSION=$env:V" "/DVIVERSION=$env:WV" "/DSRC=$src" /DEDWARD=1 packaging/windows/obhod.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item packaging/windows/AristocratNET-Edward-Setup-*.exe dist-edward/
          $src = (Resolve-Path build/win-dev).Path
          & $iscc /Q "/DVERSION=$env:V" "/DVIVERSION=$env:WV" "/DSRC=$src" /DDEV=1 packaging/windows/obhod.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item packaging/windows/AristocratNET-Dev-Setup-*.exe dist-dev/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: edward-windows-setup
          path: dist-edward/*
      # Сборка разработчика — только среди файлов запуска (Actions), в релиз не попадает.
      - uses: actions/upload-artifact@v4
        with:
          name: _dev-windows
          path: dist-dev/*

  linux:
    needs: [version, test]
    # Ubuntu 22.04: собранная программа запускается на Ubuntu 22.04+, Linux Mint 21+, Debian 12, Fedora.
    runs-on: ubuntu-22.04
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Зависимости Go (go.sum)
        working-directory: core
        # gVisor (сетевой стек для WARP): в go.mod — версия для Go 1.20 (Windows 7),
        # для новых Go берём свежую.
        run: |
          go get gvisor.dev/gvisor@v0.0.0-20250503011706-39ed1f5ac29c
          go mod download
      - name: Библиотеки окна (GTK3, WebKitGTK 4.1)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Код подключения и пароль разработчика (секреты DEV_DIRECT и DEV_PASSWORD)
        env:
          DEV_DIRECT: ${{ secrets.DEV_DIRECT }}
          DEV_PASSWORD: ${{ secrets.DEV_PASSWORD }}
        run: |
          echo "DEVDIRECT=$(bash scripts/dev-direct.sh)" >> "$GITHUB_ENV"
          echo "DEVHASH=$(cd core && go run ./tools/devhash)" >> "$GITHUB_ENV"
      - name: Сборка obhod (linux/amd64, нативное окно + трей)
        working-directory: core
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -tags gui -trimpath \
            -ldflags "-s -w -X main.appVersion=$V" -o ../build/linux/obhod .
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -tags gui -trimpath \
            -ldflags "-s -w -X main.appVersion=$V -X main.edition=edward -X main.devDirectCode=$DEVDIRECT" -o ../build/obhod-edward .
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -tags "gui dev" -trimpath \
            -ldflags "-s -w -X main.appVersion=$V -X main.devPassHash=$DEVHASH -X main.devDirectCode=$DEVDIRECT" -o ../build/obhod-dev .
      - name: Tor для Linux
        run: bash scripts/fetch-tor.sh linux-x86_64 build/linux/tor
      - name: nfpm
        run: |
          NV=$(curl -fsSL -o /dev/null -w '%{url_effective}' https://github.com/goreleaser/nfpm/releases/latest | grep -oE '[0-9]+\.[0-9]+\.[0-9]+$')
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NV}/nfpm_${NV}_Linux_x86_64.tar.gz" | tar xz nfpm
          sudo mv nfpm /usr/local/bin/
      - name: DEB и RPM
        run: |
          mkdir -p dist
          VERSION="$V" nfpm package -f packaging/linux/nfpm.yaml -p deb -t dist/
          VERSION="$V" nfpm package -f packaging/linux/nfpm.yaml -p rpm -t dist/
          tar czf "dist/obhod-$V-linux-amd64.tar.gz" -C build/linux obhod tor
          ls -la dist
          # Edward Version (DEB): тот же пакет, но программа — Edward Version.
          mkdir -p dist-edward
          cp build/obhod-edward build/linux/obhod
          VERSION="$V" nfpm package -f packaging/linux/nfpm.yaml -p deb -t dist-edward/
          for f in dist-edward/*.deb; do mv "$f" "dist-edward/AristocratNET-Edward-$V-linux-amd64.deb"; done
          tar czf "dist-edward/obhod-edward-$V-linux-amd64.tar.gz" -C build/linux obhod tor
          # Сборка разработчика (DEB): тот же пакет, но программа — из сборки разработчика.
          mkdir -p dist-dev
          cp build/obhod-dev build/linux/obhod
          VERSION="$V" nfpm package -f packaging/linux/nfpm.yaml -p deb -t dist-dev/
          for f in dist-dev/*.deb; do mv "$f" "dist-dev/AristocratNET-Dev-$V-linux-amd64.deb"; done
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: edward-linux
          path: dist-edward/*
      - uses: actions/upload-artifact@v4
        with:
          name: _dev-linux
          path: dist-dev/*

  android:
    needs: [version, test]
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.version.outputs.version }}
      CODE: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Зависимости Go (go.sum)
        working-directory: core
        # gVisor (сетевой стек для WARP): в go.mod — версия для Go 1.20 (Windows 7),
        # для новых Go берём свежую.
        run: |
          go get gvisor.dev/gvisor@v0.0.0-20250503011706-39ed1f5ac29c
          go mod download
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Встроенные мосты Tor и GeoIP
        run: |
          bash scripts/fetch-tor.sh android-aarch64 build/tor-android || bash scripts/fetch-tor.sh linux-x86_64 build/tor-android
          mkdir -p android/app/src/main/assets
          cp build/tor-android/pt/pt_config.json android/app/src/main/assets/
          # GeoIP — для выбора страны выхода из Tor.
          cp build/tor-android/data/geoip build/tor-android/data/geoip6 android/app/src/main/assets/ || echo "Нет GeoIP — выбор страны Tor на Android будет недоступен"
      - name: Android NDK r27 (с ним проверен hev-socks5-tunnel)
        run: |
          NDKV=27.2.12479018
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -d "$ANDROID_HOME/ndk/$NDKV" ] || (yes | "$SDKM" --install "ndk;$NDKV" > /dev/null)
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDKV" >> "$GITHUB_ENV"
      - name: Код подключения к разработчику (секрет DEV_DIRECT)
        env:
          DEV_DIRECT: ${{ secrets.DEV_DIRECT }}
        run: |
          echo "DEVDIRECT=$(bash scripts/dev-direct.sh)" >> "$GITHUB_ENV"
      - name: Нативные части (ядро, lyrebird, hev-socks5-tunnel)
        run: bash scripts/build-android-natives.sh "$V"
      - name: Ключ подписи (если задан в секретах)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Подпись release-ключом"
          else
            echo "Секрет ANDROID_KEYSTORE_BASE64 не задан — APK будет подписан debug-ключом"
          fi
      - name: Сборка APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p dist dist-edward
          # 1) Для всех пользователей: ядро без маршрута «Ебаная Чукотка», без подписи Edward Version.
          gradle -p android --no-daemon assembleRelease -PappVersion="$V" -PappVersionCode="$CODE"
          for f in android/app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" .apk | sed -E 's/^app-//; s/-release(-unsigned)?$//')
            cp "$f" "dist/AristocratNET-$V-android-$abi.apk"
          done
          # 2) Edward Version: ядро с кодом подключения и подпись на главном экране.
          rm -rf android/app/build/outputs/apk
          for d in build/android/edward/*/; do
            cp "$d/libobhod.so" "android/app/src/main/jniLibs/$(basename "$d")/libobhod.so"
          done
          gradle -p android --no-daemon assembleRelease -PappVersion="$V" -PappVersionCode="$CODE" -Pedition=edward
          for f in android/app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" .apk | sed -E 's/^app-//; s/-release(-unsigned)?$//')
            cp "$f" "dist-edward/AristocratNET-Edward-$V-android-$abi.apk"
          done
          ls -la dist dist-edward
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: edward-android
          path: dist-edward/*
