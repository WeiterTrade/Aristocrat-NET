<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Обход</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1b1f24; --muted:#6b7380; --line:#e4e7ec;
          --accent:#2f6fed; --ok:#1f9d55; --warn:#c2410c; --off:#9aa3af; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1216; --card:#171b21; --text:#e8ebef; --muted:#98a1ad; --line:#262c35;
            --accent:#5b8ff9; --ok:#34c77b; --warn:#f97316; --off:#59616d; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:460px; margin:0 auto; padding:18px 16px 28px; }
  header { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; }
  h1 { font-size:17px; margin:0; }
  .ver { color:var(--muted); font-size:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px; }
  .hero { text-align:center; padding:24px 16px 20px; }
  .power { width:128px; height:128px; border-radius:50%; border:0; cursor:pointer; background:var(--off); color:#fff;
           font:600 15px system-ui,sans-serif; box-shadow:0 0 0 10px color-mix(in srgb,var(--off) 15%,transparent); transition:.2s; }
  .power.on { background:var(--ok); box-shadow:0 0 0 10px color-mix(in srgb,var(--ok) 18%,transparent); }
  .status { margin-top:16px; font-weight:600; }
  .sub { color:var(--muted); font-size:13px; margin-top:2px; }
  .err { color:var(--warn); font-size:13px; margin-top:8px; white-space:pre-wrap; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin:0 0 10px; font-weight:600; }
  input[type=text], input[type=number], select { border:1px solid var(--line); border-radius:10px; padding:9px 10px;
           background:var(--bg); color:var(--text); font:inherit; }
  input[type=text] { width:100%; }
  .btn { border:0; border-radius:10px; padding:9px 14px; font:inherit; font-weight:600; cursor:pointer; background:var(--accent); color:#fff; white-space:nowrap; }
  .btn.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  .btn:disabled { opacity:.6; cursor:default; }
  .row { display:flex; gap:8px; align-items:center; }
  table { width:100%; border-collapse:collapse; margin-top:10px; font-size:13px; }
  td { padding:6px 4px; border-top:1px solid var(--line); vertical-align:top; }
  td.r { text-align:right; color:var(--muted); white-space:nowrap; }
  .yes { color:var(--ok); font-weight:600; } .no { color:var(--warn); }
  .info { color:var(--muted); font-size:12px; word-break:break-word; }
  .verdict { margin-top:10px; padding:10px; border-radius:10px; background:var(--bg); font-size:13px; }
  .opt { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px; }
  .opt .l { flex:1; } .opt.col { flex-direction:column; align-items:stretch; } .opt.col select { width:100%; }
  textarea { width:100%; border:1px solid var(--line); border-radius:10px; padding:9px 10px; background:var(--bg); color:var(--text); font:12px ui-monospace,Consolas,monospace; }
  .torline { margin-top:10px; font-size:13px; color:var(--muted); }
  .torline b { color:var(--text); }
  .bar { height:4px; background:var(--line); border-radius:4px; margin:6px auto 0; max-width:220px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--accent); }
  .tag.tor { background:color-mix(in srgb,#7d4698 18%,transparent); color:#a46bc4; } .hint { color:var(--muted); font-size:12px; }
  .list { font-size:13px; }
  .list .it { display:flex; align-items:center; gap:8px; padding:6px 0; border-top:1px solid var(--line); }
  .list .it:first-child { border-top:0; }
  .list .h { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .tag { font-size:11px; padding:2px 7px; border-radius:20px; background:color-mix(in srgb,var(--accent) 12%,transparent); color:var(--accent); white-space:nowrap; }
  .tag.bad { background:color-mix(in srgb,var(--warn) 12%,transparent); color:var(--warn); }
  .x { border:0; background:none; color:var(--muted); cursor:pointer; font-size:14px; }
  .empty { color:var(--muted); font-size:13px; }
  details summary { cursor:pointer; color:var(--muted); font-size:13px; }
  pre { max-height:220px; overflow:auto; background:var(--bg); border-radius:10px; padding:10px; font-size:11px; margin:10px 0 0; white-space:pre-wrap; word-break:break-all; }
  footer { display:flex; justify-content:space-between; gap:8px; }
</style>
</head>
<body>
<main>
  <header><h1>Обход</h1><span class="ver" id="ver"></span></header>

  <section class="card hero">
    <button class="power" id="power">Включить</button>
    <div class="status" id="status">Выключено</div>
    <div class="sub" id="sub"></div>
    <div class="err" id="err"></div>
    <div class="torline" id="torline"></div>
  </section>

  <section class="card">
    <h2>Проверить сайт</h2>
    <div class="row">
      <input type="text" id="host" placeholder="например, youtube.com" spellcheck="false">
      <button class="btn" id="test">Проверить</button>
    </div>
    <div id="testOut"></div>
  </section>

  <section class="card">
    <h2>Настройки</h2>
    <div class="opt col"><div class="l">Маршрут</div><select id="route"></select></div>
    <div class="opt"><div class="l">Метод обхода DPI<br><span class="hint">«Авто» подбирает метод для каждого сайта и запоминает его</span></div>
      <select id="mode"></select></div>
    <div id="torBox">
      <div class="opt"><div class="l">Мосты Tor<br><span class="hint">В России и Казахстане Tor без мостов заблокирован</span></div>
        <select id="bridges"></select></div>
      <div id="customBox" style="display:none;margin-top:8px">
        <textarea id="custom" rows="4" spellcheck="false" placeholder="Строки мостов (obfs4 / webtunnel), по одной в строке. Получить: Telegram-бот @GetBridgesBot или bridges.torproject.org"></textarea>
        <button class="btn ghost" id="saveCustom" style="margin-top:6px">Сохранить мосты</button>
      </div>
    </div>
    <div class="opt"><div class="l">Шифрованный DNS (DoH)</div>
      <select id="doh"><option value="cloudflare">Cloudflare</option><option value="google">Google</option><option value="quad9">Quad9</option></select></div>
    <div class="opt"><label class="l"><input type="checkbox" id="sys"> Системный прокси<br><span class="hint">Иначе укажите в браузере прокси 127.0.0.1:<span id="portLbl"></span> (HTTP или SOCKS5)</span></label></div>
    <div class="opt"><label class="l"><input type="checkbox" id="auto"> Включать при запуске программы</label></div>
    <div class="opt"><div class="l">Порт прокси</div><input type="number" id="port" min="1024" max="65535" style="width:100px"></div>
  </section>

  <section class="card">
    <h2>Сайты</h2>
    <div class="list" id="sites"></div>
  </section>

  <section class="card">
    <details id="logBox"><summary>Журнал</summary><pre id="logs"></pre></details>
  </section>

  <footer><span class="hint" id="stats"></span><button class="btn ghost" id="quit">Выход</button></footer>
</main>

<script>
const TOKEN = location.hash.slice(1);
const $ = id => document.getElementById(id);
let S = null;

async function api(path, body) {
  const r = await fetch('/api/' + path, {
    method: body === undefined ? 'GET' : 'POST',
    headers: { 'X-Token': TOKEN, 'Content-Type': 'application/json' },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const j = await r.json().catch(() => ({ error: 'Нет связи с программой' }));
  if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status);
  return j;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

function render(s) {
  S = s; const st = s.settings;
  $('ver').textContent = 'v' + s.version;
  $('power').className = 'power' + (s.on ? ' on' : '');
  $('power').textContent = s.on ? 'Выключить' : 'Включить';
  $('status').textContent = s.on ? 'Обход включён' : 'Выключено';
  $('sub').textContent = s.on ? (st.sys_proxy && !s.proxy_err ? 'Системный прокси 127.0.0.1:' + st.port : 'Прокси 127.0.0.1:' + st.port + ' — укажите его в браузере') : 'Трафик идёт как обычно';
  $('err').textContent = s.proxy_err || '';
  const sel = $('mode');
  if (!sel.options.length) {
    sel.add(new Option('Авто', 'auto'));
    s.strategies.forEach(x => sel.add(new Option(x.name, x.id)));
  }
  fill('route', s.routes); fill('bridges', s.bridges);
  $('route').value = st.route; $('bridges').value = st.bridges;
  $('torBox').style.display = st.route === 'dpi' ? 'none' : '';
  $('customBox').style.display = st.bridges === 'custom' ? '' : 'none';
  if (document.activeElement !== $('custom')) $('custom').value = st.custom_bridges || '';
  const t = s.tor;
  let tl = '';
  if (s.on && st.route !== 'dpi') {
    if (t.status === 'ready') tl = 'Tor: <b>подключён</b> — запасной путь для заблокированных по IP сайтов';
    else if (t.status === 'starting') tl = 'Tor: подключается… ' + t.progress + '%<div class="bar"><i style="width:' + t.progress + '%"></i></div>';
    else if (t.error) tl = 'Tor: <span class="no">' + esc(t.error) + '</span>';
  }
  $('torline').innerHTML = tl;
  sel.value = st.mode; $('doh').value = st.doh; $('sys').checked = st.sys_proxy; $('auto').checked = st.auto_start;
  if (document.activeElement !== $('port')) $('port').value = st.port;
  $('portLbl').textContent = st.port;
  $('stats').textContent = s.on ? 'Соединений: ' + s.active + ' активных, ' + s.total + ' всего' : '';

  let h = '';
  (s.blocked || []).forEach(b => h += `<div class="it"><span class="h" title="${esc(b.reason)}">${esc(b.host)}<br><span class="info">${esc(b.reason)}</span></span><span class="tag bad">не открылся</span><button class="x" data-h="${esc(b.host)}">✕</button></div>`);
  (s.learned || []).forEach(l => h += `<div class="it"><span class="h">${esc(l.host)}</span><span class="tag${l.strategy === 'tor' ? ' tor' : ''}">${esc(l.name)}</span><button class="x" data-h="${esc(l.host)}">✕</button></div>`);
  $('sites').innerHTML = h || '<div class="empty">Здесь появятся сайты, для которых понадобился особый метод.</div>';
  $('sites').querySelectorAll('.x').forEach(b => b.onclick = () => api('forget', { host: b.dataset.h }).then(render));
}

function fill(id, items) {
  const el = $(id);
  if (el.options.length) return;
  items.forEach(x => el.add(new Option(x.name, x.id)));
}

async function refresh() {
  try { render(await api('state')); } catch (e) { $('err').textContent = e.message; }
  if ($('logBox').open) try {
    const pre = $('logs'), end = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 4;
    pre.textContent = (await api('logs')).join('\n'); if (end) pre.scrollTop = pre.scrollHeight;
  } catch {}
}

async function save(patch) {
  try { render(await api('settings', Object.assign({}, S.settings, patch))); } catch (e) { $('err').textContent = e.message; }
}

$('power').onclick = async () => { $('err').textContent = ''; try { render(await api('toggle', {})); } catch (e) { $('err').textContent = e.message; } };
$('mode').onchange = e => save({ mode: e.target.value });
$('route').onchange = e => save({ route: e.target.value });
$('bridges').onchange = e => save({ bridges: e.target.value });
$('saveCustom').onclick = () => save({ custom_bridges: $('custom').value });
$('doh').onchange = e => save({ doh: e.target.value });
$('sys').onchange = e => save({ sys_proxy: e.target.checked });
$('auto').onchange = e => save({ auto_start: e.target.checked });
$('port').onchange = e => save({ port: parseInt(e.target.value, 10) || 8881 });
$('logBox').ontoggle = refresh;

async function runTest() {
  const host = $('host').value.trim(); if (!host) return;
  const btn = $('test'), out = $('testOut');
  btn.disabled = true; btn.textContent = 'Проверяю…';
  out.innerHTML = '<div class="verdict">Пробую все методы и Tor, до минуты…</div>';
  try {
    const res = await api('test', { host });
    const ok = res.filter(r => r.ok);
    const plain = res.find(r => r.strategy === 'none');
    const tor = res.find(r => r.strategy === 'tor');
    const dpiOk = ok.filter(r => r.strategy !== 'tor');
    let v;
    if (plain && plain.ok) v = '✓ Сайт открывается и без обхода.';
    else if (!dpiOk.length && tor && tor.ok) v = '✓ Напрямую сайт недоступен, но открывается <b>через Tor</b> — в режиме «Авто» это произойдёт само.';
    else if (dpiOk.length) v = '✓ Блокировка по DPI — обходится. Лучший метод: <b>' + esc(dpiOk.sort((a, b) => a.ms - b.ms)[0].name) + '</b>. В режиме «Авто» он подберётся сам.';
    else if (res.every(r => /TCP|IP/.test(r.info))) v = '✗ Не удаётся даже подключиться к серверу сайта — это блокировка по IP. Включите маршрут «Авто» или «Всё через Tor» — Tor обходит такие блокировки.';
    else v = '✗ Ни один метод не помог. Возможно, у вашего провайдера более строгая фильтрация или сайт заблокирован по IP.';
    out.innerHTML = '<div class="verdict">' + v + '</div><table>' + res.map(r =>
      `<tr><td>${esc(r.name)}<div class="info">${esc(r.info)}</div></td><td class="r ${r.ok ? 'yes' : 'no'}">${r.ok ? '✓ ' + r.ms + ' мс' : '✗'}</td></tr>`).join('') + '</table>';
  } catch (e) { out.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; }
  btn.disabled = false; btn.textContent = 'Проверить';
}
$('test').onclick = runTest;
$('host').onkeydown = e => { if (e.key === 'Enter') runTest(); };

$('quit').onclick = async () => {
  if (!confirm('Выключить обход и закрыть программу?')) return;
  try { await api('quit', {}); } catch {}
  clearInterval(timer);
  document.body.innerHTML = '<main><div class="card hero"><div class="status">Программа закрыта</div><div class="sub">Системный прокси выключен. Окно можно закрыть.</div></div></main>';
};
refresh();
const timer = setInterval(refresh, 1500);
</script>
</body>
</html>
